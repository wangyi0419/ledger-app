name: Deploy Web (PWA)

# 将记账 App 构建为 Web 版，并双路部署：
#  1) Cloudflare Pages  —— 国内有节点，iPhone 主力路径（地址 https://ledger-app.pages.dev）
#  2) GitHub Pages     —— 国际/备用路径（地址 https://<user>.github.io/ledger-app/）
# iPhone 用 Safari「添加到主屏幕」即可当 App 使用（无需苹果开发者账号）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 生成 web 平台目录（若缺失）
        run: flutter create --platforms=web --project-name ledger_sync_app .

      - name: 安装依赖
        run: flutter pub get

      # ---- Cloudflare 版（base-href /，根路径）----
      - name: 构建 Web Release (Cloudflare 版)
        run: flutter build web --release --web-renderer=html --base-href="/"
      - name: 注入 PWA 标签 (Cloudflare 版)
        run: python3 tools/inject_pwa.py --dir build/web
      - name: 暂存 Cloudflare 产物
        run: rm -rf build/cf && cp -r build/web build/cf

      # ---- GitHub Pages 版（base-href /<仓库名>/）----
      - name: 构建 Web Release (GitHub Pages 版)
        run: flutter build web --release --web-renderer=html --base-href="/${{ github.event.repository.name }}/"
      - name: 注入 PWA 标签 (GitHub Pages 版)
        run: python3 tools/inject_pwa.py --dir build/web
      - name: 暂存 GitHub Pages 产物
        run: rm -rf build/gp && cp -r build/web build/gp

      - name: 上传 GitHub Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gp

      - name: 上传 Cloudflare 产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dist
          path: build/cf

  deploy-gp:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cf:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Cloudflare 产物
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-dist
          path: dist

      - name: 部署到 Cloudflare Pages
        # 仅当仓库配置了 Cloudflare Secrets 时才执行；未配置自动跳过，不影响 GitHub Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ledger-app
          directory: dist
          branch: main
