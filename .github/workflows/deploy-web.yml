name: Deploy Web (PWA)

# 将记账 App 构建为 Web 版并部署到 GitHub Pages，
# iPhone 用 Safari「添加到主屏幕」即可当 App 使用（无需苹果开发者账号）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 生成 web 平台目录（若缺失）
        run: flutter create --platforms=web .

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Web Release
        # 项目 Pages 的基准路径为 /<仓库名>/，自定义域名可去掉 --base-href
        run: flutter build web --release --base-href="/${{ github.event.repository.name }}/"

      - name: 注入 PWA 安装标签（iPhone 添加到主屏幕）
        run: python3 tools/inject_pwa.py

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
