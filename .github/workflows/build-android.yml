name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 安装并授权 Android SDK
        run: |
          SDKMGR=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          export PATH=$PATH:$(dirname $SDKMGR):$ANDROID_HOME/platform-tools
          yes | $SDKMGR --licenses
          $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 生成 android 平台目录（若缺失）
        run: flutter create --platforms=android --project-name ledger_sync_app .

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Release APK（未签名，可直接安装）
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
